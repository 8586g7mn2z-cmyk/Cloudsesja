# Studio Fryzur Aneta Kunc: dodatkowe dyrektywy nginx dla Pleska
# Gdzie wkleić: Plesk → Strony WWW i domeny → anetakunc.vbox.pl (i docelowo anetakunc.pl)
#               → Ustawienia Apache i nginx → „Dodatkowe dyrektywy nginx” → OK.
#
# Co to daje:
# 1. Pliki strony serwuje bezpośrednio nginx, bez przekazywania do Apache.
#    Dziś nginx przekazuje do Apache nawet zdjęcia i fonty, a gdy Apache nie odpowiada, odsyła 502.
# 2. Przeglądarka trzyma CSS/JS/fonty/zdjęcia w pamięci podręcznej (dziś brak nagłówków cache,
#    a reguły z .htaccess nie działają, bo pliki obsługuje nginx).
#
# CSS i JS mają w adresie wersję (?v=...). Po aktualizacji tych plików zmień wersję w plikach HTML.

# fonty: rok, niezmienne
location ~* \.woff2$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# CSS i JS (z wersją w adresie): 30 dni
location ~* \.(?:css|js)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}

# zdjęcia i ikony: 7 dni
location ~* \.(?:webp|avif|png|jpe?g|svg|ico|gif)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

# pozostałe pliki statyczne
location ~* \.(?:webmanifest|xml|txt)$ {
    try_files $uri =404;
    expires 1d;
}

# strony HTML: zawsze świeże (przeglądarka sprawdza tylko, czy plik się zmienił)
location ~* \.html$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

# strona główna pod adresem /
location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}

